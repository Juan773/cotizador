<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cotizador V3.0 [BUILD 202602012300]</title>

  <!-- Google Fonts for Themes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@400;600&family=Merriweather:wght@700&family=Open+Sans:wght@400&family=Montserrat:wght@600&family=Lato:wght@400&family=Raleway:wght@700&family=Inter:wght@400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=202602232350" />

  <style>
    :root {
      /* Dynamic Theme Variables - Default: Digital Trade Group */
      --theme-primary: #002c77;
      --theme-secondary: #0066cc;
      --theme-accent: #00a8e1;
      --theme-header-font: 'Roboto', sans-serif;
      --theme-body-font: 'Roboto', sans-serif;
      --theme-header-weight: 700;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand__logo" id="brandLogo" src="assets/logo.jpeg" alt="Logo" />
      <div class="brand__text">
        <div class="brand__name" id="brandName">DIGITAL TRADE GROUP</div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="brand__tag" id="brandTag">TECHNOLOGY & IMPORTS</div>
          <span
            style="font-size: 11px; background: #ff4d4d; color: white; padding: 2px 8px; border-radius: 4px; font-weight: 900; box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);">V3.3
            (PRO-01)</span>
        </div>
      </div>
    </div>
    <div class="company-selector">
      <label for="companySelect" class="company-selector__label">Empresa:</label>
      <select id="companySelect" class="company-selector__select">
        <option value="">Cargando...</option>
      </select>
    </div>
    <div class="topbar__actions">
      <button id="btnReset" class="btn btn--ghost" type="button">Limpiar</button>
      <button id="btnGenerate" class="btn btn--primary" type="button">Generar PDF</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Datos de la cotización</h2>

      <form id="quoteForm" autocomplete="off">
        <div class="grid">
          <div class="field">
            <label>N° Cotización</label>
            <input id="quoteNo" required placeholder="A-000000" />
          </div>
          <div class="field">
            <label>Fecha</label>
            <input id="quoteDate" type="date" required />
          </div>
        </div>

        <h3>Cliente</h3>
        <div class="grid">
          <div class="field span-2">
            <label>Cliente</label>
            <input id="clientName" required placeholder="Nombre del cliente" />
          </div>
          <div class="field">
            <label>RUC</label>
            <input id="clientDoc" placeholder="00000000000" />
          </div>
          <div class="field">
            <label>Atención</label>
            <input id="clientAttn" placeholder="Sr(a). ..." />
          </div>
          <div class="field span-2">
            <label>Dirección</label>
            <input id="clientAddress" placeholder="Dirección del cliente" />
          </div>
          <div class="field">
            <label>Departamento</label>
            <input id="clientDepartment" placeholder="Lima" />
          </div>
          <div class="field">
            <label>Distrito</label>
            <input id="clientDistrict" placeholder="Miraflores" />
          </div>
          <div class="field">
            <label>Entrega</label>
            <input id="delivery" placeholder="24-48 horas" />
          </div>
          <div class="field" id="currencySelectWrap">
            <label>Moneda</label>
            <select id="currency">
              <option value="S/">S/ (PEN)</option>
              <option value="$">$ (USD)</option>
            </select>
          </div>
          <div class="field" id="currencyInputWrap" style="display:none;">
            <label>Moneda</label>
            <input id="currencyInput" value="S/" placeholder="S/ o $" />
          </div>
          <div class="field" id="validityWrap" style="display:none;">
            <label>Validez</label>
            <input id="validity" value="15 días" />
          </div>
          <div class="field">
            <label>Cond. Venta</label>
            <input id="paymentTerms" placeholder="50% adelanto / 50% contra entrega" />
          </div>
        </div>

        <h3>Ítems</h3>
        <div class="items">
          <div class="items__header">
            <div class="right">#</div>
            <div>Nombre</div>
            <div>Modelo</div>
            <div>Marca</div>
            <div class="right">Cant.</div>
            <div>Un.</div>
            <div class="right">Precio</div>
            <div class="right">Total</div>
            <div></div>
          </div>

          <div id="itemsBody" class="items__body"></div>

          <div class="items__footer">
            <div style="display: flex; gap: 10px;">
              <button id="btnAddItem" class="btn btn--secondary" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Agregar ítem
              </button>
              <input type="file" id="excelUpload" accept=".xlsx, .xls" style="display: none;" />
              <button id="btnImportExcel" class="btn btn--excel" type="button" title="Importar formato de Excel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Importar Excel
              </button>
            </div>
            <div class="taxbox">
              <div class="field inline">
                <label>Cálculo</label>
                <button type="button" id="btnToggleIgv" class="btn btn--secondary" data-igv="add"
                  style="padding: 6px 10px; font-weight: 600; width: 85px;">Con IGV</button>
              </div>
              <div class="field inline">
                <label>IGV %</label>
                <input id="taxRate" type="number" step="0.01" min="0" value="18" />
              </div>
              <div class="field inline">
                <label>Descuento</label>
                <input id="discount" type="number" step="0.01" min="0" value="0" />
              </div>
              <div class="field inline">
                <label style="color: var(--accent); font-weight: 800;">Total Manual</label>
                <input id="manualTotal" type="number" step="0.01" min="0" placeholder="Opcional"
                  style="border-color: var(--accent);" />
              </div>
              <!-- Hidden/Advanced manual overrides -->
              <input type="hidden" id="manualSubtotal" />
              <input type="hidden" id="manualIGV" />
            </div>
          </div>
        </div>
      </form>

      <div style="text-align: right; margin-top: 10px; font-size: 10px; color: #667085; opacity: 0.7;">
        v2.2 (Actualización 1 de Feb)
      </div>
    </section>

    <section class="panel panel--preview">
      <div class="previewTop">
        <h2>Preview (PDF)</h2>
        <div class="pill">A4</div>
      </div>

      <!-- This element is what we export to PDF -->
      <div id="pdfRoot" class="sheet">
        <!-- Content will be injected here by JS -->
      </div><!-- /#pdfRoot -->

      <!-- ═══ TEMPLATES ═══ -->
      <template id="tmpl-dtg">
        <!-- ═══ CABECERA ═══ -->
        <div class="classic-header">
          <!-- Izquierda: Logo + Empresa -->
          <div class="classic-header__brand">
            <img class="classic-logo" id="sheetLogo" src="assets/logo.jpeg" alt="Logo" />
            <div class="classic-brand-info">
              <div class="classic-brand-name" id="sheetBrandName">DIGITAL TRADE GROUP</div>
              <div class="classic-brand-sub" id="sheetContactInfo"></div>
              <div class="classic-brand-sub" id="sheetEmail"></div>
              <div class="classic-brand-sub" id="sheetAddress"></div>
            </div>
          </div>
          <!-- Derecha: Recuadro cotización -->
          <div class="classic-quote-box">
            <div class="classic-quote-box__title" id="documentTitleLabel">COTIZACIÓN</div>
            <div class="classic-quote-box__row">
              <span>N°</span><span id="p_quoteNo">—</span>
            </div>
            <div class="classic-quote-box__row">
              <span>Fecha</span><span id="p_quoteDate">—</span>
            </div>
          </div>
        </div>

        <!-- ═══ PRESENTACIÓN ═══ -->
        <div class="classic-intro">
          Estimados señores: Atendiendo su amable solicitud le hacemos llegar a ustedes nuestra mejor oferta de los
          siguientes productos:
        </div>

        <!-- ═══ DATOS DEL CLIENTE ═══ -->
        <div class="classic-client">
          <div class="classic-client__row">
            <div class="classic-client__label" id="label_client">SEÑORES</div>
            <div class="classic-client__value" id="p_clientName">—</div>
            <div class="classic-client__label-r">RUC</div>
            <div class="classic-client__value-r" id="p_clientDoc">—</div>
          </div>
          <div class="classic-client__row">
            <div class="classic-client__label">DIRECCIÓN</div>
            <div class="classic-client__value" id="p_clientAddress">—</div>
            <div class="classic-client__label-r">DIST.</div>
            <div class="classic-client__value-r" id="p_clientDistrict">—</div>
          </div>
          <div class="classic-client__row">
            <div class="classic-client__label">ATENCIÓN</div>
            <div class="classic-client__value" id="p_clientAttn">—</div>
            <div class="classic-client__label-r">DEPTO.</div>
            <div class="classic-client__value-r" id="p_clientDepartment">—</div>
          </div>
          <div class="classic-client__row">
            <div class="classic-client__label">ENTREGA</div>
            <div class="classic-client__value" id="p_delivery">—</div>
            <div class="classic-client__label-r">COND. VENTA</div>
            <div class="classic-client__value-r" id="p_paymentTerms">—</div>
          </div>
        </div>

        <!-- ═══ TABLA DE ÍTEMS ═══ -->
        <div class="classic-table-wrap">
          <table class="classic-table">
            <thead>
              <tr>
                <th class="ct-item">ITEM</th>
                <th class="ct-image">IMAGEN</th>
                <th class="ct-desc" id="label_item_header">DESCRIPCIÓN</th>
                <th class="ct-um">UM</th>
                <th class="ct-cant">CANT.</th>
                <th class="ct-price">PRECIO UNIT.</th>
                <th class="ct-total">TOTAL</th>
              </tr>
            </thead>
            <tbody id="p_itemsBody"></tbody>
          </table>
        </div>

        <!-- ═══ MONTO EN LETRAS ═══ -->
        <div class="classic-words-row">
          <span class="classic-words-label">SON:</span>
          <span class="classic-words-value" id="p_amountWords">—</span>
        </div>

        <!-- ═══ SECCIÓN INFERIOR: BANCO + TOTALES ═══ -->
        <div class="classic-bottom">
          <!-- Izquierda: Datos bancarios + condiciones -->
          <div class="classic-bottom__left">
            <div class="classic-section-title">INFORMACIÓN DE PAGO</div>
            <div class="classic-bank">
              <div class="classic-bank__name" id="bankNameText">BCP</div>
              <div class="classic-bank__detail">
                <div id="bankAccount">CTA CORRIENTE BCP 1917234591075</div>
                <div id="bankCCI">CCI 00219100723459107555</div>
                <div id="bankHolder">DIGITAL WAVE IMPORTS SAC</div>
              </div>
            </div>
            <div class="classic-section-title" style="margin-top:8px;">MÉTODOS DE PAGO</div>
            <div class="classic-payment-text">VISA · MASTERCARD · PAGO EFECTIVO (NIUBIZ)</div>
            <div class="benefits" style="margin-top:6px;">
              <div id="benefitsText" contenteditable="true" title="Haz clic para editar"
                style="font-size: 9px; font-family: inherit; border: 1px solid #d0d5dd; padding: 4px 6px; color: #344054; background: #fff; line-height: 1.5; min-height: 30px; cursor: text; white-space: pre-wrap;">
              </div>
            </div>
          </div>

          <!-- Derecha: Box de totales -->
          <div class="classic-totals">
            <div class="classic-totals__row">
              <span>SUB TOTAL</span>
              <span>S/</span>
              <strong id="p_subtotal" contenteditable="true" title="Editar Subtotal manualmente">—</strong>
            </div>
            <div class="classic-totals__row">
              <span>IGV (<span id="p_tax_rate">18</span>%)</span>
              <span>S/</span>
              <strong id="p_igv" contenteditable="true" title="Editar IGV manualmente">—</strong>
            </div>
            <div class="classic-totals__row classic-totals__row--grand">
              <span>TOTAL GENERAL</span>
              <span>S/</span>
              <strong id="p_total" contenteditable="true" title="Haz clic para editar el total directamente">—</strong>
            </div>
            <div class="classic-totals__currency-note">
              Moneda: <span id="p_currency">—</span>
            </div>
          </div>
        </div>

        <!-- ═══ CONDICIONES + FIRMA ═══ -->
        <div class="classic-footer">
          <div class="classic-conditions">
            <div class="classic-section-title">CONDICIONES GENERALES</div>
            <div class="classic-condition-row"><span>Lugar de entrega:</span> <span id="p_delivery_foot">—</span></div>
            <div class="classic-condition-row"><span>Validez de la oferta:</span> <span>15 días calendario</span></div>
            <div class="classic-condition-row"><span>Observaciones:</span> <span>Precios sujetos a disponibilidad de
                stock.</span></div>
            <div class="classic-igv-note">* Los precios unitarios de los productos INCLUYEN IGV</div>
          </div>

        </div>
      </template>

      <template id="tmpl-coldfrog">
        <!-- Coldfrog specific design -->
        <div class="coldfrog-layout">
          <div class="cf-header">
            <div class="cf-brand">
              <img class="cf-logo" id="sheetLogo" src="assets/logo.jpeg" alt="Logo" />
              <div class="cf-brand-info">
                <div class="cf-brand-name" id="sheetBrandName">COLDFROG STORE</div>
                <div class="cf-brand-sub" id="sheetContactInfo"></div>
                <div class="cf-brand-sub" id="sheetEmail"></div>
                <div class="cf-brand-sub" id="sheetAddress"></div>
              </div>
            </div>
            <div class="cf-quote-box">
              <div class="cf-quote-row">
                <span class="cf-label">R.U.C.</span><span class="cf-val" id="sheetRUC">—</span>
              </div>
              <div class="cf-quote-title" id="documentTitleLabel">PROFORMA</div>
              <div class="cf-quote-row">
                <span class="cf-label">N°</span><span class="cf-val" id="p_quoteNo">—</span>
              </div>
            </div>
          </div>

          <div class="cf-client-box">
            <div class="cf-client-col">
              <div class="cf-client-row">
                <span class="cf-label">Señor(es):</span><span class="cf-val" id="p_clientName">—</span>
              </div>
              <div class="cf-client-row">
                <span class="cf-label">D.N.I/R.U.C:</span><span class="cf-val" id="p_clientDoc">—</span>
              </div>
              <div class="cf-client-row">
                <span class="cf-label">Dirección:</span><span class="cf-val" id="p_clientAddress">—</span>
              </div>
              <div class="cf-client-row">
                <span class="cf-label">Distrito:</span><span class="cf-val" id="p_clientDistrict">—</span>
              </div>
              <div class="cf-client-row">
                <span class="cf-label">Depto:</span><span class="cf-val" id="p_clientDepartment">—</span>
              </div>
            </div>
            <div class="cf-client-col">
              <div class="cf-client-row">
                <span class="cf-label">Fecha:</span><span class="cf-val" id="p_quoteDate">—</span>
              </div>
              <div class="cf-client-row">
                <span class="cf-label">Moneda:</span><span class="cf-val" id="p_currency">—</span>
              </div>
              <div class="cf-client-row">
                <span class="cf-label">Plazo de Entrega:</span><span class="cf-val" id="p_delivery">—</span>
              </div>
            </div>
          </div>

          <table class="cf-table">
            <thead>
              <tr>
                <th class="ct-image"></th>
                <th class="ct-desc">DESCRIPCION</th>
                <th class="ct-cant">CANT.</th>
                <th class="ct-um">UND.</th>
                <th class="ct-price">P.UNIT.</th>
                <th class="ct-total">TOTAL</th>
              </tr>
            </thead>
            <tbody id="p_itemsBody"></tbody>
          </table>

          <div class="cf-words-row">
            <span class="cf-words-label">SON:</span> <span class="cf-words-value" id="p_amountWords">—</span>
          </div>

          <div class="cf-bottom">
            <div class="cf-bank-details">
              <div class="cf-section-title">DATOS BANCARIOS</div>
              <div class="cf-bank-row">
                <span class="cf-bank-name" id="bankNameText">BBVA</span>
                <span class="cf-bank-acc" id="bankAccount">CTA 191 05832267 0 77</span>
                <span class="cf-bank-cci" id="bankCCI">CCI 002 19110583226707756</span>
              </div>
              <div class="cf-holder" id="bankHolder">—</div>
              <p class="cf-note">Toda transferencia en Soles / Enviar Constancia al correo y/o Whatsapp</p>
            </div>
            <div class="cf-totals">
              <div class="cf-tot-row">
                <span>Total Grabado</span><span id="p_subtotal" contenteditable="true">—</span>
              </div>
              <div class="cf-tot-row">
                <span>IGV <span id="p_tax_rate">18</span>%</span><span id="p_igv" contenteditable="true">—</span>
              </div>
              <div class="cf-tot-row cf-grand">
                <span>Importe Total</span><span id="p_total" contenteditable="true">—</span>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template id="tmpl-interlab">
        <div class="interlab-layout">
          <div class="il-header">
            <div class="il-brand">
              <img class="il-logo" id="sheetLogo" src="assets/logo.jpeg" alt="Logo" />
              <div class="il-brand-info">
                <div class="il-brand-name" id="sheetBrandName">INTERLAB PERU INVERSIONES</div>
                <div class="il-brand-desc">Venta y Mantenimiento de Equipos e Instrumentos de Laboratorio, Balanzas
                  Analíticas, Reactivos Químicos y Artículos de Vidrio</div>
                <div class="il-brand-sub" id="sheetContactInfo"></div>
                <div class="il-brand-sub" id="sheetEmail"></div>
                <div class="il-brand-sub" id="sheetAddress"></div>
              </div>
            </div>
            <div class="il-quote-box">
              <div class="il-quote-title" id="documentTitleLabel" style="font-family: var(--theme-header-font);">
                COTIZACIÓN</div>
              <div class="il-quote-no" id="p_quoteNo">—</div>
            </div>
          </div>

          <div class="il-client-box">
            <div class="il-client-main">
              <div class="il-row"><span class="il-label">NOMBRE:</span><span class="il-val" id="p_clientName">—</span>
              </div>
              <div class="il-row"><span class="il-label">R.U.C.:</span><span class="il-val" id="p_clientDoc">—</span>
              </div>
              <div class="il-row"><span class="il-label">ATENCIÓN AL CLIENTE:</span><span class="il-val"
                  id="p_clientAttn">—</span></div>
              <div class="il-row"><span class="il-label">DIRECCIÓN:</span><span class="il-val"
                  id="p_clientAddress">—</span></div>
              <div class="il-row"><span class="il-label">DISTRITO:</span><span class="il-val"
                  id="p_clientDistrict">—</span></div>
              <div class="il-row"><span class="il-label">DEPARTAMENTO:</span><span class="il-val"
                  id="p_clientDepartment">—</span></div>
            </div>
            <div class="il-client-meta">
              <div class="il-row"><span class="il-label">FECHA:</span><span class="il-val" id="p_quoteDate">—</span>
              </div>
              <div class="il-row"><span class="il-label">TIPO PAGO:</span><span class="il-val"
                  id="p_paymentTerms">—</span></div>
              <div class="il-row"><span class="il-label">ENTREGA:</span><span class="il-val" id="p_delivery">—</span>
              </div>
            </div>
          </div>

          <div class="il-intro">
            Por medio del presente nos dirigimos a usted para saludarlo cordialmente y así mismo hacerle alcance de la
            cotización de lo solicitado:
          </div>

          <table class="il-table">
            <thead>
              <tr>
                <th class="ct-item">ITEM</th>
                <th class="ct-code">CODIGO</th>
                <th class="ct-cant">CANT.</th>
                <th class="ct-um">U.M.</th>
                <th class="ct-desc">PRODUCTOS</th>
                <th class="ct-image">IMAGEN</th>
                <th class="ct-price">P. UNITARIO</th>
                <th class="ct-total">TOTAL</th>
              </tr>
            </thead>
            <tbody id="p_itemsBody"></tbody>
          </table>

          <div class="il-bottom">
            <div class="il-bank-details">
              <div class="il-section-title">Nuestras Cuentas Bancarias a Nombre de la Empresa:</div>
              <div class="il-holder" id="bankHolder">—</div>
              <div class="il-accounts-list">
                <!-- Banks injected here or hardcoded based on style -->
                <div class="il-acc-row">
                  <strong id="bankNameText">BBVA</strong> CTA: <span id="bankAccount">—</span> / CCI: <span
                    id="bankCCI">—</span>
                </div>
              </div>
            </div>
            <div class="il-totals">
              <div class="il-tot-row">
                <span>SUB-TOTAL</span><span id="p_subtotal" contenteditable="true">—</span>
              </div>
              <div class="il-tot-row">
                <span>IGV <span id="p_tax_rate">18</span>%</span><span id="p_igv" contenteditable="true">—</span>
              </div>
              <div class="il-tot-row il-grand">
                <span>TOTAL</span><span id="p_total" contenteditable="true">—</span>
              </div>
            </div>
          </div>
        </div>
      </template>

      <template id="tmpl-iceberg">
        <div class="iceberg-layout">
          <div class="ib-header">
            <img class="ib-logo" id="sheetLogo" src="assets/logo.jpeg" alt="Logo" />
          </div>
          <div class="ib-title" id="documentTitleLabel">COTIZACIÓN</div>

          <div class="ib-client-intro">
            <strong>Cliente:</strong> <span id="p_clientName">—</span> | <strong>RUC:</strong> <span
              id="p_clientDoc">—</span><br>
            <strong>Atención:</strong> <span id="p_clientAttn">—</span><br>
            <strong>Dirección:</strong> <span id="p_clientAddress">—</span>, <span id="p_clientDistrict">—</span>, <span
              id="p_clientDepartment">—</span><br>
            <br>
            Estimado Cliente: A continuación se presentan los detalles del presupuesto solicitado.
          </div>

          <div class="ib-meta-grid">
            <div class="ib-meta"><span class="ib-label">Fecha:</span> <span id="p_quoteDate">—</span></div>
            <div class="ib-meta"><span class="ib-label">N° de presupuesto:</span> <span id="p_quoteNo">—</span></div>
            <div class="ib-meta"><span class="ib-label">Moneda:</span> <span id="p_currency">—</span></div>
            <div class="ib-meta"><span class="ib-label">Cond. Venta:</span> <span id="p_paymentTerms">—</span></div>
            <div class="ib-meta"><span class="ib-label">Entrega:</span> <span id="p_delivery">—</span></div>
          </div>

          <table class="ib-table">
            <thead>
              <tr>
                <th class="ct-image">IMG</th>
                <th class="ct-desc">DESCRIPCION</th>
                <th class="ct-cant">CANT.</th>
                <th class="ct-price">PRECIO UNIT.</th>
                <th class="ct-total">TOTAL</th>
              </tr>
            </thead>
            <tbody id="p_itemsBody"></tbody>
          </table>

          <div class="ib-grand-box">
            <div class="ib-grand-label">Total</div>
            <div class="ib-grand-val" id="p_total" contenteditable="true">—</div>
          </div>

          <div class="ib-footer">
            <div class="ib-contact-line">
              <span id="sheetEmail"></span> | <span id="sheetContactInfo"></span>
            </div>
            <div class="ib-banks">
              <span id="bankNameText"></span> CTA: <span id="bankAccount"></span> | CCI: <span id="bankCCI"></span>
            </div>
          </div>
        </div>
      </template>

      <template id="tmpl-global">
        <div class="global-layout">
          <div class="gl-header">
            <div class="gl-brand">
              <img class="gl-logo" id="sheetLogo" src="assets/logo.jpeg" alt="Logo" />
            </div>
            <div class="gl-quote-box">
              <div class="gl-quote-title"><span id="documentTitleLabel">Presupuesto</span> # <span
                  id="p_quoteNo">—</span></div>
            </div>
          </div>

          <div class="gl-address-row">
            <div class="gl-from">
              <strong>De</strong><br>
              <div id="sheetBrandName">GLOBAL IMPORT</div>
              <div id="sheetAddress"></div>
            </div>
            <div class="gl-to">
              <strong>Para</strong><br>
              <div id="p_clientName">—</div>
              <div>RUC: <span id="p_clientDoc">—</span></div>
              <div>Atención: <span id="p_clientAttn">—</span></div>
              <div>Dirección: <span id="p_clientAddress">—</span>, <span id="p_clientDistrict">—</span>, <span
                  id="p_clientDepartment">—</span></div>
            </div>
          </div>

          <div class="gl-dates-box">
            <div class="gl-date-col">
              <div class="gl-date-label">Fecha</div>
              <div class="gl-date-val" id="p_quoteDate">—</div>
            </div>
            <div class="gl-date-col">
              <div class="gl-date-label">Validez</div>
              <div class="gl-date-val" id="p_validity">15 días</div>
            </div>
            <div class="gl-date-col">
              <div class="gl-date-label">Moneda</div>
              <div class="gl-date-val" id="p_currency">—</div>
            </div>
          </div>

          <table class="gl-table">
            <thead>
              <tr>
                <th class="ct-item">Ítem</th>
                <th class="ct-image">IMG REF</th>
                <th class="ct-desc">Descripción</th>
                <th class="ct-price">Precio Unit.</th>
                <th class="ct-cant">Cantidad</th>
                <th class="ct-total">Total</th>
              </tr>
            </thead>
            <tbody id="p_itemsBody"></tbody>
          </table>

          <div class="gl-bottom">
            <div class="gl-notes">
              <strong>Términos y condiciones</strong><br>
              <span id="p_paymentTerms">—</span><br>
              Entrega: <span id="p_delivery">—</span>
              <div style="margin-top:10px;">
                <strong>Datos de Pago</strong><br>
                <span id="bankNameText"></span> CTA: <span id="bankAccount"></span><br>
                CCI: <span id="bankCCI"></span><br>
                <span id="bankHolder"></span>
              </div>
            </div>
            <div class="gl-totals">
              <div class="gl-tot-row">
                <span>Sub-Total</span><span id="p_subtotal" contenteditable="true">—</span>
              </div>
              <div class="gl-tot-row">
                <span>IGV <span id="p_tax_rate">18</span>%</span><span id="p_igv" contenteditable="true">—</span>
              </div>
              <div class="gl-tot-row gl-grand">
                <span>Total</span><span id="p_total" contenteditable="true">—</span>
              </div>
            </div>
          </div>
        </div>
      </template>

    </section>
  </main>

  <!-- html2pdf (jsPDF + html2canvas) - Local version -->
  <script src="html2pdf.bundle.min.js"></script>
  <!-- SheetJS for Excel Parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="app.v4.js"></script>
</body>
